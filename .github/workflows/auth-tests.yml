name: Flyer Studio authentication checks
on:
  pull_request:
    paths:
      - "site/index.html"
      - "tests/**"
      - ".github/workflows/auth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test authentication recovery and JavaScript syntax
        run: node --test tests/*.test.mjs
