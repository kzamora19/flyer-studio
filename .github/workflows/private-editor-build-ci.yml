name: MegaFlyer protected-bundle packaging (draft only)
on:
  push:
    branches: [feature/ptg-private-delivery-poc-20261121]
    paths:
      - "scripts/build-private-flyer.mjs"
      - "tests/private-editor-build.test.mjs"
      - "tests/private-delivery-policy.test.mjs"
      - "supabase/functions/flyer-editor-delivery/**"
      - "supabase/functions/_shared/studio-private-policy.mjs"
      - "supabase/config.toml"
      - ".github/workflows/private-editor-build-ci.yml"
      - "site/**"
  pull_request:
    paths:
      - "scripts/build-private-flyer.mjs"
      - "tests/private-editor-build.test.mjs"
      - "tests/private-delivery-policy.test.mjs"
      - "supabase/functions/flyer-editor-delivery/**"
      - "supabase/functions/_shared/studio-private-policy.mjs"
      - "supabase/config.toml"
      - ".github/workflows/private-editor-build-ci.yml"
      - "site/**"
permissions:
  contents: read
jobs:
  build-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify editor/private-bundle separation (no deployment)
        run: |
          node --check scripts/build-private-flyer.mjs
          node --test tests/private-editor-build.test.mjs
          node --test tests/private-delivery-policy.test.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Typecheck staged server-only delivery function
        run: deno check supabase/functions/flyer-editor-delivery/index.ts
      - name: Enforce public-artefact non-disclosure
        run: |
          if test -e site/private/studio.html || test -e site/private-editor.html; then
            echo "Protected source appeared inside the Pages site."; exit 1;
          fi
          test ! -e .studio-private-build/private/studio.html
