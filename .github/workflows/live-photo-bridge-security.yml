name: Live MegaFlyer photo bridge security preflight
on:
  push:
    branches: [feature/ptg-private-delivery-poc-20261121]
    paths:
      - "tests/live-photo-gateway-compatibility.mjs"
      - ".github/workflows/live-photo-bridge-security.yml"
permissions:
  contents: read
jobs:
  no-credential-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tests/live-photo-gateway-compatibility.mjs
