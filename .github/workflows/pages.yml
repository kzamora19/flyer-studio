name: Deploy Flyer Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    # Main-branch pushes must NOT republish the public editor after integration.
    # Only explicitly authorized coordinated cutover may publish the safe stub.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.MEGAFLYER_CUTOVER_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify editor-free cutover preview (fail closed)
        run: |
          node --check scripts/build-cutover-pages.mjs
          node --test tests/staged-cutover-pages.test.mjs
      - name: Build approved editor-free historical Pages output
        run: PTG_STUDIO_CUTOVER_PREVIEW=1 node scripts/build-cutover-pages.mjs staging/.cutover-release
      - name: Upload editor-free Pages artifact only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./staging/.cutover-release
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
