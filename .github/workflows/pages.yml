name: Deploy Flyer Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare PTG-only public redirect
        run: python3 scripts/prepare_pages_redirect.py
      - name: Upload protected-access redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_pages_redirect
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
